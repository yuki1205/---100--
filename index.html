<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071018" />
    <meta name="description" content="街が、ゲームフィールドになる。GPS逃走ゲーム、ランナウェイ。" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="style.css" />
    <title>ランナウェイ - GPS逃走ゲーム</title>
  </head>
  <body>
    <main id="app">
      <section class="screen home-screen" data-screen="home">
        <div class="home-content">
          <p class="eyebrow">GPS ESCAPE GAME</p>
          <h1>RUNAWAY</h1>
          <p class="jp-title">ランナウェイ</p>
          <p class="tagline">街が、ゲームフィールドになる。</p>

          <div class="best-stats" aria-label="自己ベスト">
            <div><span>BEST SCORE</span><strong id="best-score">-- pt</strong></div>
            <div><span>LONGEST DISTANCE</span><strong id="best-distance">-- km</strong></div>
          </div>

          <div class="home-actions">
            <button class="primary-button" id="solo-button" type="button">1人で遊ぶ <span>SOLO</span></button>
            <button class="disabled-button" type="button" disabled>複数人で遊ぶ <span>COMING SOON</span></button>
            <button class="text-button" id="history-button" type="button">逃走記録</button>
          </div>
        </div>
        <div class="ad-slot" aria-label="広告枠">ADVERTISEMENT</div>
      </section>

      <section class="screen game-screen is-hidden" data-screen="game">
        <div id="map" aria-label="現在地マップ"></div>
        <header class="game-header">
          <div>
            <p class="eyebrow">GPS STATUS</p>
            <strong id="gps-status" role="status">位置情報を準備中</strong>
          </div>
          <button class="icon-button" id="end-button" type="button" aria-label="ホームへ戻る" title="ホームへ戻る">×</button>
        </header>
        <section class="location-panel" aria-live="polite">
          <div class="runner-label"><i></i> RUNNER</div>
          <strong id="location-reading">GPSを取得しています</strong>
          <span id="accuracy-reading">屋外の開けた場所でお待ちください</span>
        </section>
        <div class="game-note">プレイ中は画面を見続けず、周囲の安全を最優先してください。</div>
      </section>

      <section class="screen history-screen is-hidden" data-screen="history">
        <header class="plain-header"><button class="back-button" data-back="home" type="button" aria-label="戻る">←</button><h2>逃走記録</h2></header>
        <div id="history-list" class="history-list"></div>
      </section>
    </main>

    <dialog id="safety-dialog">
      <form method="dialog">
        <p class="eyebrow">SAFETY FIRST</p>
        <h2>安全にプレイしましょう</h2>
        <ul>
          <li>走行中は画面を注視しない</li>
          <li>交通ルールを守る</li>
          <li>私有地・立入禁止区域へ入らない</li>
          <li>安全な場所でプレイする</li>
        </ul>
        <label class="check-label"><input id="safety-check" type="checkbox" /> 内容を確認しました</label>
        <button id="safety-confirm" class="primary-button" value="confirm" type="submit" disabled>はじめる</button>
      </form>
    </dialog>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="settings.js"></script>
    <script src="app.js"></script>
  </body>
</html>
